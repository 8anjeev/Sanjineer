name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA Project
        run: echo "n" | bubblewrap init --manifest https://app.sanjineer.in/manifest.json --directory twa-project --skipPwaValidation
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Build APK
        run: |
          cd twa-project
          bubblewrap build --skipSigning

      - uses: actions/upload-artifact@v4
        with:
          name: sanjineer-apk
          path: twa-project/app/build/outputs/apk/**/*.apk
