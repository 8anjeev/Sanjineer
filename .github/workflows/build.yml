name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone TWA Quickstart
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa-project

      - name: Update TWA Config
        run: |
          cd twa-project
          sed -i 's/jakearchibald.github.io\/svgomg/app.sanjineer.in/g' app/build.gradle
          sed -i 's/io.jakearchibald.svgomg/com.sanjvik.sanjineer/g' app/build.gradle
          sed -i 's/SVGOMG/Sanjineer/g' app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          cd twa-project
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sanjineer-apk
          path: twa-project/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: twa-project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
