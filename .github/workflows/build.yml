name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Clone TWA Quickstart
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa-project

      - name: Fix Gradle and Android compatibility
        working-directory: twa-project
        run: |
          # Upgrade the old archived TWA template.
          sed -i "s#classpath 'com.android.tools.build:gradle:3.2.1'#classpath 'com.android.tools.build:gradle:8.1.4'#" build.gradle

          # Replace the discontinued JCenter repository.
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle app/build.gradle

          # Use modern Android SDK versions.
          sed -i 's/compileSdkVersion 29/compileSdkVersion 34/' app/build.gradle
          sed -i 's/targetSdkVersion 29/targetSdkVersion 34/' app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 23/' app/build.gradle

          # Enable AndroidX support.
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties

          # AGP 8 requires an explicit namespace.
          if ! grep -q "namespace" app/build.gradle; then
            sed -i "s/^android {/android {\n    namespace 'com.sanjvik.sanjineer'/" app/build.gradle
          fi

          # Use a modern Android Browser Helper version.
          sed -i \
            "s#com.google.androidbrowserhelper:androidbrowserhelper:1.1.0#com.google.androidbrowserhelper:androidbrowserhelper:2.6.0#" \
            app/build.gradle

          # Keep the browser dependency compatible with compileSdk 34.
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'androidx.browser:browser:1.8.0'
              }
          }
          EOF

      - name: Configure Sanjineer package and domain
        working-directory: twa-project
        run: |
          # Configure the Sanjineer app identity.
          sed -i "s/svgomg\.firebaseapp\.com/app.sanjineer.in/g" app/build.gradle
          sed -i "s/org\.chromium\.twa\.svgomg/com.sanjvik.sanjineer/g" app/build.gradle

          # IMPORTANT:
          # AGP 8 rejects the old placeholder package in AndroidManifest.xml.
          sed -i 's/package="com.placeholder"/package="com.sanjvik.sanjineer"/g' \
            app/src/main/AndroidManifest.xml

          echo "=== Build configuration ==="
          grep -E "applicationId|hostName|namespace" app/build.gradle || true

          echo "=== Manifest package ==="
          grep -n "package=" app/src/main/AndroidManifest.xml || true

      - name: Configure app resources
        working-directory: twa-project
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Sanjineer</string>
              <string name="twa_domain">app.sanjineer.in</string>
              <string name="launch_url">/</string>
          </resources>
          EOF

          echo "=== strings.xml ==="
          cat app/src/main/res/values/strings.xml

      - name: Fix AndroidManifest exported attributes
        working-directory: twa-project
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          # Apply the package fix again defensively.
          sed -i 's/package="com.placeholder"/package="com.sanjvik.sanjineer"/g' "$MANIFEST"

          # LauncherActivity must be exported for Android 12 and newer.
          if grep -q 'android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"' "$MANIFEST"; then
            if ! grep -A3 'android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"' "$MANIFEST" | grep -q 'android:exported='; then
              sed -i \
                's#android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"#android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"\n            android:exported="true"#' \
                "$MANIFEST"
            fi
          fi

          echo "=== LauncherActivity ==="
          grep -A3 "LauncherActivity" "$MANIFEST" || true

          echo "=== Final manifest ==="
          cat "$MANIFEST"

      - name: Set up Gradle
        working-directory: twa-project
        run: |
          chmod +x gradlew

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Build APK
        working-directory: twa-project
        run: |
          ./gradlew assembleDebug --build-cache --warning-mode all

      - name: Verify APK
        run: |
          APK_PATH="twa-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK was not generated."
            find twa-project/app/build/outputs -type f -maxdepth 6 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjineer-apk
          path: twa-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: twa-project/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
