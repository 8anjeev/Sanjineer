name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Clone TWA Quickstart
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa-project

      - name: Patch old TWA template for modern Android
        working-directory: twa-project
        run: |
          # Update the Android Gradle Plugin to a modern version that works with this legacy template.
          sed -i "s#classpath 'com.android.tools.build:gradle:3.2.1'#classpath 'com.android.tools.build:gradle:7.4.2'#" build.gradle

          # Add google() if missing and replace jcenter() with mavenCentral().
          if ! grep -q "google()" build.gradle; then
            sed -i "s#repositories {#repositories {\n        google()#" build.gradle
          fi
          if ! grep -q "google()" app/build.gradle; then
            sed -i "s#repositories {#repositories {\n        google()#" app/build.gradle
          fi

          sed -i 's/jcenter()/mavenCentral()/g' build.gradle app/build.gradle

          # Modernize SDKs and minSdk.
          sed -i 's/compileSdkVersion 29/compileSdkVersion 34/' app/build.gradle
          sed -i 's/targetSdkVersion 29/targetSdkVersion 34/' app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 23/' app/build.gradle

          # AndroidX compatibility.
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties

          # Upgrade browser helper to a version with exported attrs.
          sed -i \
            "s#com.google.androidbrowserhelper:androidbrowserhelper:1.1.0#com.google.androidbrowserhelper:androidbrowserhelper:2.6.0#" \
            app/build.gradle

          # Force compatible browser library for compileSdk 34.
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'androidx.browser:browser:1.8.0'
              }
          }
          EOF

      - name: Configure package + domain
        working-directory: twa-project
        run: |
          # Set the app domain and package.
          sed -i "s/svgomg\.firebaseapp\.com/app.sanjineer.in/g" app/build.gradle
          sed -i "s/org\.chromium\.twa\.svgomg/com.sanjvik.sanjineer/g" app/build.gradle

          # Remove the old placeholder package from the manifest.
          sed -i 's/package="com.placeholder"/package="com.sanjvik.sanjineer"/g' app/src/main/AndroidManifest.xml

          echo "=== Build config ==="
          grep -E "applicationId|hostName" app/build.gradle || true

          echo "=== Manifest package ==="
          grep -n "package=" app/src/main/AndroidManifest.xml || true

      - name: Configure app resources
        working-directory: twa-project
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Sanjineer</string>
              <string name="twa_domain">app.sanjineer.in</string>
              <string name="launch_url">/</string>
          </resources>
          EOF

          echo "=== strings.xml ==="
          cat app/src/main/res/values/strings.xml

      - name: Fix AndroidManifest exported attribute
        working-directory: twa-project
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          # Defensive replacement for the placeholder package.
          sed -i 's/package="com.placeholder"/package="com.sanjvik.sanjineer"/g' "$MANIFEST"

          # Add exported=true to the launcher activity for Android 12+.
          if grep -q 'android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"' "$MANIFEST"; then
            if ! grep -A3 'android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"' "$MANIFEST" | grep -q 'android:exported='; then
              sed -i \
                's#android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"#android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"\n            android:exported="true"#' \
                "$MANIFEST"
            fi
          fi

          echo "=== LauncherActivity ==="
          grep -A3 "LauncherActivity" "$MANIFEST" || true

      - name: Set up Gradle wrapper
        working-directory: twa-project
        run: |
          chmod +x gradlew

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.1-all.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Build APK
        working-directory: twa-project
        run: |
          ./gradlew assembleDebug --build-cache --warning-mode all

      - name: Verify APK
        run: |
          APK_PATH="twa-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not generated."
            find twa-project/app/build/outputs -type f -maxdepth 6 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjineer-apk
          path: twa-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: twa-project/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
